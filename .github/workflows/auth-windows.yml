name: Ente Auth Community Windows

on:
  pull_request:
    paths:
      - "**"
  push:
    paths:
      - "**"

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore EnteAuthCommunity.slnx
      - name: Test core
        run: dotnet test tests/Ente.Auth.Core.Tests/Ente.Auth.Core.Tests.csproj --no-restore
      - name: Test infrastructure
        run: dotnet test tests/Ente.Auth.Infrastructure.Tests/Ente.Auth.Infrastructure.Tests.csproj --no-restore
      - name: Publish Windows app
        run: dotnet publish src/Ente.Auth.App/Ente.Auth.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o publish_output
      - name: Build Installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnteAuth-Setup
          path: Output/EnteAuth-Setup.exe
      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnteAuth-Portable
          path: publish_output/
      - name: Upload to Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path publish_output\* -DestinationPath EnteAuth-Portable.zip
          gh release create v1.0.2 Output/EnteAuth-Setup.exe EnteAuth-Portable.zip -t "v1.0.2" --generate-notes || gh release upload v1.0.2 Output/EnteAuth-Setup.exe EnteAuth-Portable.zip --clobber
